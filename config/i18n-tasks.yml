---

base_locale: en
locales: [en]

data:
  external:
    - "<%= %x[bundle info decidim-core --path].chomp %>/config/locales/%{locale}.yml"
    - "<%= %x[bundle info decidim-proposals --path].chomp %>/config/locales/%{locale}.yml"
    - "<%= %x[bundle info decidim-admin --path].chomp %>/config/locales/%{locale}.yml"
    - "<%= %x[bundle info decidim-participatory_processes --path].chomp %>/config/locales/%{locale}.yml"
    - "<%= %x[bundle info decidim-templates --path].chomp %>/config/locales/%{locale}.yml"

ignore_unused:
  # Form attribute / admin-log field labels resolved by human_attribute_name
  - activemodel.attributes.proposal.*
  - activemodel.attributes.proposal_photo.*
  - activemodel.attributes.taxonomy_evaluator.*
  - activemodel.attributes.taxonomy_evaluators.*
  # Component manifest actions/name/settings resolved dynamically by the components UI
  - decidim.components.proposals.settings.*
  - decidim.components.reporting_proposals.*
  # Stats resolved by name from the stats registry
  - decidim.statistics.reporting_proposals_*
  # Event classes resolve their i18n scope from the class name
  - decidim.events.proposals.proposal_published.*
  - decidim.events.proposals.proposal_published_for_admin.*
  - decidim.events.proposals.proposal_published_for_space.*
  # Resolved at runtime via distance_of_time_in_words(scope:) — not literal t()
  - decidim.reporting_proposals.admin.answer_overdue.datetime.distance_in_words.*
  - decidim.reporting_proposals.admin.answer_pending.datetime.distance_in_words.*
  - decidim.reporting_proposals.admin.evaluate_pending.datetime.distance_in_words.*
  - decidim.reporting_proposals.admin.time_elapsed.datetime.distance_in_words.*
  # Resolved by export-manifest name / wizard step name (interpolated keys)
  - decidim.reporting_proposals.admin.exports.*
  - decidim.proposals.proposals.compare.title
  - decidim.proposals.proposals.wizard_steps.step_compare
  # Referenced from lib/decidim/reporting_proposals/admin_engine.rb (outside the default search paths)
  - decidim.reporting_proposals.admin.menu.*
  # Resolved at runtime by AdminLog::TaxonomyEvaluatorPresenter#action_string (interpolated keys)
  - decidim.reporting_proposals.admin_log.taxonomy_evaluator.*

ignore_missing:
