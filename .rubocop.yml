inherit_gem:
  decidim-dev: rubocop-decidim.yml

AllCops:
  Exclude:
    - 'db/**/*.rb'
    - 'vendor/**/*'
    - "spec/decidim_dummy_app*/**/*"
    - "development_app/**/*"

RSpec/DescribeClass:
  Exclude:
    - spec/i18n_spec.rb
    - "spec/system/**/*"

Style/RedundantArrayConstructor:
  Enabled: false
